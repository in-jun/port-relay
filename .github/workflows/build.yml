name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-${{ github.workflow }}-

      - name: Build
        run: |
          xcodebuild build \
            -project PortRelay.xcodeproj \
            -scheme PortRelay \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/PortRelay.app Payload/
          zip -r PortRelay.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PortRelay
          path: PortRelay.ipa
