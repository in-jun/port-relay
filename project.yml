name: PortRelay
options:
  bundleIdPrefix: com.portrelay
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  PortRelay:
    type: application
    platform: iOS
    sources:
      - Sources/PortRelay
    info:
      path: Info.plist
      properties:
        CFBundleName: PortRelay
        CFBundleDisplayName: Port Relay
        CFBundleIdentifier: com.portrelay.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UIBackgroundModes:
          - location
        NSLocalNetworkUsageDescription: "Port Relay needs local network access to listen for incoming connections and forward traffic."
        NSLocationWhenInUseUsageDescription: "Used to keep the relay running while the app is in background."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Used to keep the relay running while the app is in background."
